    /* ── STATE ── */
    let currentFilter = 'all';
    let currentView = 'grid';

    /* ── NAVIGATION ── */
    function goToGP(page) {
      if (page) window.location.href = page;
    }

    /* ── FILTER ── */
    function setFilter(e, filter) {
      currentFilter = filter;
      document.querySelectorAll('.filter-pill').forEach(p => p.classList.remove('active'));
      e.target.classList.add('active');
      render();
    }

    function filteredGps() {
      if (currentFilter === 'all') return gps;
      if (currentFilter === 'done') return gps.filter(g => g.status === 'done');
      if (currentFilter === 'upcoming') return gps.filter(g => g.status === 'upcoming');
      return gps.filter(g => g.winner_tag === currentFilter);
    }

    /* ── VIEW ── */
    function setView(v) {
      currentView = v;
      document.getElementById('btnGrid').classList.toggle('active', v === 'grid');
      document.getElementById('btnList').classList.toggle('active', v === 'list');
      render();
    }

    /* ── RENDER ── */
    function render() {
      const data = filteredGps();
      const main = document.getElementById('mainContent');

      if (data.length === 0) {
        main.innerHTML = `<div style="text-align:center;padding:60px 20px;color:var(--text-dim);font-family:'Barlow Condensed',sans-serif;font-size:18px;letter-spacing:1px;text-transform:uppercase;">Aucun résultat</div>`;
        return;
      }

      if (currentView === 'grid') renderGrid(data, main);
      else renderList(data, main);
    }

    function renderGrid(data, main) {
      const done     = data.filter(g => g.status === 'done');
      const upcoming = data.filter(g => g.status === 'upcoming');
      let html = '';

      if (done.length > 0) {
        if (upcoming.length > 0 || currentFilter === 'all')
          html += `<div class="section-label">Courses terminées (${done.length})</div>`;
        html += `<div class="gp-grid">`;
        done.forEach(g => { html += gpCard(g); });
        html += `</div>`;
      }

      if (upcoming.length > 0) {
        html += `<div class="section-label">À venir (${upcoming.length})</div>`;
        html += `<div class="gp-grid">`;
        upcoming.forEach(g => { html += gpCard(g); });
        html += `</div>`;
      }

      main.innerHTML = html;
    }

    function gpCard(g) {
      const isDone   = g.status === 'done';
      const isNext   = g.status === 'next';
      const hasPage  = !!g.page;

      const badgeClass = isDone ? 'done' : isNext ? 'next' : 'upcoming';
      const badgeLabel = isDone ? 'Terminé' : isNext ? 'Prochain' : 'À venir';

      // Curseur et style selon si la page existe
      const clickable  = isDone && hasPage;
      const cardStyle  = clickable ? 'cursor:pointer;' : isDone ? 'cursor:default;' : 'cursor:default;opacity:0.6;';
      const clickAttr  = clickable ? `onclick="goToGP('${g.page}')"` : '';

      let resultsHtml = '';
      if (isDone) {
        const viewBtn = hasPage
          ? `<div style="margin-top:10px;text-align:right;">
               <span style="font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--red);">
                 Voir les résultats →
               </span>
             </div>`
          : '';
        resultsHtml = `
          <div class="gp-podium">
            <div class="gp-winner-row">
              <span class="gp-winner-pos">🥇</span>
              <span class="gp-winner-dot" style="background:${g.winner.color}"></span>
              <span class="gp-winner-name">${g.winner.name}</span>
              <span class="gp-winner-time">${g.winner.time}</span>
            </div>
            <div class="gp-winner-row">
              <span class="gp-winner-pos" style="color:#C0C0C0">🥈</span>
              <span class="gp-winner-dot" style="background:${g.p2.color}"></span>
              <span class="gp-winner-name">${g.p2.name}</span>
            </div>
            <div class="gp-winner-row">
              <span class="gp-winner-pos" style="color:#CD7F32">🥉</span>
              <span class="gp-winner-dot" style="background:${g.p3.color}"></span>
              <span class="gp-winner-name">${g.p3.name}</span>
            </div>
          </div>
          ${viewBtn}`;
      } else {
        resultsHtml = `<div class="gp-upcoming-info">Pas encore disputé</div>`;
      }

      return `
        <div class="gp-card ${g.status}" style="${cardStyle}" ${clickAttr}>
          <div class="gp-card-top">
            <div>
              <div class="gp-round">Tour ${g.round}</div>
              <span class="gp-flag">${g.flag}</span>
              <div class="gp-name">${g.name}</div>
              <div class="gp-circuit">${g.circuit}</div>
            </div>
            <span class="gp-status-badge ${badgeClass}">${badgeLabel}</span>
          </div>
          <div class="gp-card-body">
            <div class="gp-date">${g.date}</div>
            ${resultsHtml}
          </div>
        </div>`;
    }

    function renderList(data, main) {
      let html = `<div class="gp-list">`;
      data.forEach(g => {
        const isDone  = g.status === 'done';
        const hasPage = !!g.page;
        const clickable = isDone && hasPage;
        const clickAttr = clickable ? `onclick="goToGP('${g.page}')"` : '';
        const arrowColor = clickable ? 'var(--red)' : 'var(--text-ghost)';

        html += `
          <div class="gp-list-item" style="${clickable ? 'cursor:pointer;' : ''}" ${clickAttr}>
            <div class="gp-list-round">${g.round}</div>
            <div class="gp-list-flag">${g.flag}</div>
            <div class="gp-list-info">
              <div class="gp-list-name">${g.name}</div>
              <div class="gp-list-circuit">${g.circuit}</div>
            </div>
            <div class="gp-list-date">${g.date}</div>
            <div class="gp-list-winner">
              ${isDone
                ? `<span class="gp-list-winner-dot" style="background:${g.winner.color}"></span>
                   <span class="gp-list-winner-name">${g.winner.name}</span>`
                : `<span style="font-size:11px;color:var(--text-dim);font-family:'Barlow Condensed',sans-serif;letter-spacing:1px;text-transform:uppercase;">À venir</span>`
              }
            </div>
            <span class="gp-list-arrow" style="color:${arrowColor}">›</span>
          </div>`;
      });
      html += `</div>`;
      main.innerHTML = html;
    }

    /* Init */
    render();
  </script>
